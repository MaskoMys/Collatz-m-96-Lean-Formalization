name = "CollatzM96"
defaultTargets = ["CollatzM96"]

# Mathlib is pinned to the release tag matching `lean-toolchain`.
# The toolchain and this rev MUST agree; if you bump one, bump the other
# (see docs/BUILD.md for the version-mismatch recipe).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.15.0"

[[lean_lib]]
name = "CollatzM96"
